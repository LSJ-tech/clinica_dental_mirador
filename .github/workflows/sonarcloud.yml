name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # SonarCloud necesita el historial completo (no un shallow clone)
          # para poder calcular qué es código "nuevo" en cada análisis.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests backend con cobertura
        working-directory: backend
        run: |
          # --require-hashes obliga a que cada paquete instalado coincida
          # byte a byte con el hash verificado en requirements-ci.txt
          # (protege contra que se sirva un artefacto distinto al esperado
          # para la misma version). --only-binary evita ademas ejecutar
          # setup.py de un paquete fuente.
          pip install --only-binary :all: --require-hashes -r requirements-ci.txt
          coverage run -m pytest
          coverage xml -o coverage.xml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tests frontend con cobertura
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
