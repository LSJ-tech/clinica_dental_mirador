# Blueprint de Render para el despliegue real (backend + frontend + DB).
# Ver informes/informe_tecnico.md para el contexto de arquitectura.
#
# URLs *.onrender.com por ahora -- cuando el dominio propio
# (elmirador.devquad.cl) tenga su DNS configurado, agregarlo a
# DJANGO_ALLOWED_HOSTS / DJANGO_CSRF_TRUSTED_ORIGINS / DJANGO_CORS_ALLOWED_ORIGINS
# del backend, y como custom domain del static site.
#
# plan: free en el backend -- suficiente para esta demo/prueba inicial, sin
# costo. Ojo: se "duerme" tras ~15 min sin trafico y tarda unos 30-50 seg en
# despertar en la primera visita del dia (ver informes/informe_tecnico.md,
# seccion Infraestructura). Subir a "starter" antes de que la clinica lo use
# de verdad en horario de atencion.
services:
  - type: web
    name: clinica-mirador-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn mirador.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: clinica-mirador-backend.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://clinica-mirador-backend.onrender.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://clinica-mirador-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-mirador-db
          property: connectionString
      # Configurar a mano en el dashboard antes de aceptar pacientes reales:
      # DJANGO_SUPERUSER_USERNAME/PASSWORD/EMAIL (crea el primer staff)
      # WHATSAPP_CLOUD_API_TOKEN, WHATSAPP_PHONE_NUMBER_ID (milestone WhatsApp)

  - type: web
    name: clinica-mirador-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://clinica-mirador-backend.onrender.com/api
    routes:
      # SPA: cualquier ruta (ej. /staff/pacientes/5) sirve index.html y
      # react-router resuelve el resto en el navegador.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: clinica-mirador-db
    plan: free
