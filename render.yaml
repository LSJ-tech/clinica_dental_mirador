# Blueprint de Render para el despliegue real (backend + frontend + DB).
# Ver informes/informe_tecnico.md para el contexto de arquitectura.
#
# URLs *.onrender.com por ahora -- cuando el dominio propio
# (clinicadentalelmirador.devquad.cl) tenga su DNS configurado, agregarlo a
# DJANGO_ALLOWED_HOSTS / DJANGO_CSRF_TRUSTED_ORIGINS / DJANGO_CORS_ALLOWED_ORIGINS
# del backend, y como custom domain del static site.
#
# plan: free en el backend -- suficiente para esta demo/prueba inicial, sin
# costo. Ojo: se "duerme" tras ~15 min sin trafico y tarda unos 30-50 seg en
# despertar en la primera visita del dia (ver informes/informe_tecnico.md,
# seccion Infraestructura). Subir a "starter" antes de que la clinica lo use
# de verdad en horario de atencion.
services:
  - type: web
    name: clinica-mirador-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn mirador.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: clinica-mirador-backend.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://clinica-mirador-backend.onrender.com,https://clinicadentalelmirador.devquad.cl
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://clinica-mirador-frontend.onrender.com,https://clinicadentalelmirador.devquad.cl
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-mirador-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://clinicadentalelmirador.devquad.cl
      # Configurar a mano en el dashboard antes de aceptar pacientes reales:
      # DJANGO_SUPERUSER_USERNAME/PASSWORD/EMAIL (crea el primer staff)
      # WHATSAPP_CLOUD_API_TOKEN, WHATSAPP_PHONE_NUMBER_ID (milestone WhatsApp)
      # EMAIL_HOST_PASSWORD -- la API key de Resend (cuenta de sending_access,
      # ver backend/.env local para el valor; nunca va commiteada ni en este
      # archivo). Se manda por la API HTTP de Resend (django-anymail), no
      # por SMTP: Render bloquea los puertos SMTP salientes en el plan free
      # (ver settings.py). DEFAULT_FROM_EMAIL usa por ahora contacto@devquad.cl
      # (ver DEFAULT_FROM_EMAIL en settings.py) hasta que la clínica tenga su
      # propio envío configurado -- devquad.cl ya está verificado en Resend.

  # Recordatorio/reconfirmación de cita: corre una vez al día y manda el
  # correo a las citas de mañana (ver clinica/management/commands/
  # enviar_recordatorios.py). Los cron jobs de Render no tienen plan free,
  # así que esto no se activa solo -- hay que crearlo a mano en el
  # dashboard (o correr "render blueprint launch" de nuevo) una vez que se
  # acepte el costo (~US$1/mes en plan starter).
  - type: cron
    name: clinica-mirador-recordatorios
    env: python
    plan: starter
    rootDir: backend
    schedule: "0 13 * * *" # 13:00 UTC ~= 9-10am Chile (según horario de verano)
    buildCommand: "./build.sh"
    startCommand: "python manage.py enviar_recordatorios"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Debe ser la MISMA que el servicio web (no generateValue acá): los
      # links de confirmación se firman con esta clave, y hay que poder
      # validarlos sin importar cuál de los dos servicios generó el token.
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: clinica-mirador-backend
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: clinica-mirador-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://clinicadentalelmirador.devquad.cl
      # EMAIL_HOST_PASSWORD (la misma API key de Resend que el servicio web)
      # se configura a mano acá también en el dashboard.

  - type: web
    name: clinica-mirador-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://clinica-mirador-backend.onrender.com/api
    routes:
      # SPA: cualquier ruta (ej. /staff/pacientes/5) sirve index.html y
      # react-router resuelve el resto en el navegador.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: clinica-mirador-db
    plan: free
