# Configuración de SonarCloud (sonarcloud.io).
# El projectKey debe coincidir exactamente con el que aparece en el
# dashboard del proyecto en SonarCloud -- si el import automático de
# GitHub le puso otro key, ajustar acá.
sonar.projectKey=LSJ-tech_clinica_dental_mirador
sonar.organization=lsj-tech

# Backend (Django) y frontend (React) del mismo repo.
sonar.sources=backend,frontend/src

# Tests y código generado/de terceros, fuera del análisis.
sonar.exclusions=**/migrations/**,**/venv/**,**/node_modules/**,**/staticfiles/**,**/dist/**
# sonar.tests/sonar.test.inclusions no tienen efecto en el modo actual
# de SonarCloud ("new analysis scope UX" -- lo dice el propio log del
# scanner). Por eso los archivos de test se excluyen del calculo de
# cobertura con sonar.coverage.exclusions en vez de intentar
# reclasificarlos como "tests": sin esto, Vitest los excluye a proposito
# de su propio lcov.info (no tiene sentido medir la cobertura de un test
# contra si mismo) y SonarCloud los contaba en 0%, inflando las lineas
# sin cubrir del new code.
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,**/test_*.py,**/tests.py,**/setupTests.js

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
