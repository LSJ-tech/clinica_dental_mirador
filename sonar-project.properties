# Configuración de SonarCloud (sonarcloud.io).
# El projectKey debe coincidir exactamente con el que aparece en el
# dashboard del proyecto en SonarCloud -- si el import automático de
# GitHub le puso otro key, ajustar acá.
sonar.projectKey=LSJ-tech_clinica_dental_mirador
sonar.organization=lsj-tech

# Backend (Django) y frontend (React) del mismo repo.
sonar.sources=backend,frontend/src

# Tests y código generado/de terceros, fuera del análisis.
sonar.exclusions=**/migrations/**,**/venv/**,**/node_modules/**,**/staticfiles/**,**/dist/**
sonar.tests=backend
sonar.test.inclusions=**/tests.py

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
