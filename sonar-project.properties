# Configuración de SonarCloud (sonarcloud.io).
# El projectKey debe coincidir exactamente con el que aparece en el
# dashboard del proyecto en SonarCloud -- si el import automático de
# GitHub le puso otro key, ajustar acá.
sonar.projectKey=LSJ-tech_clinica_dental_mirador
sonar.organization=lsj-tech

# Backend (Django) y frontend (React) del mismo repo.
sonar.sources=backend,frontend/src

# Tests y código generado/de terceros, fuera del análisis.
sonar.exclusions=**/migrations/**,**/venv/**,**/node_modules/**,**/staticfiles/**,**/dist/**
# frontend/src esta tambien en sonar.sources porque ahi conviven los
# componentes y sus *.test.jsx (co-ubicados); sin listarlo aca tambien,
# esos *.test.jsx se tratan como codigo fuente que "deberia" tener
# cobertura -- y como Vitest los excluye a proposito de su propio
# lcov.info, quedaban en 0% e inflaban las lineas sin cubrir del new code.
sonar.tests=backend,frontend/src
sonar.test.inclusions=**/tests.py,**/test_*.py,**/*.test.js,**/*.test.jsx,**/setupTests.js

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
